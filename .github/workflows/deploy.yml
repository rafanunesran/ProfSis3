name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Muda para "master" se a sua branch principal tiver esse nome
  workflow_dispatch:

# ESTAS SÃO AS PERMISSÕES QUE CORRIGEM O ERRO 401
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 (historico completo) - necessario para "git rev-list --count HEAD"
          # no passo de build do APK Android gerar um versionCode sempre crescente de verdade
          # (um clone raso sempre contaria 1 commit).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK (para o app Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
        continue-on-error: true

      # Builda o APK do app-android/ e coloca em app-android/dist/, para ser servido pelo
      # GitHub Pages no MESMO domínio do site (evita o problema de download cross-origin
      # que o link direto para GitHub Releases tinha em navegadores mobile mais simples,
      # ex: Lemur Browser - o download "abria uma página do GitHub" e travava no meio).
      # continue-on-error: se o build do APK falhar por qualquer motivo, o site continua
      # sendo publicado normalmente (só sem atualizar o APK desta vez) - nunca deve
      # bloquear o deploy da extensão, que é a parte crítica em produção.
      - name: Build APK do app Android
        continue-on-error: true
        run: |
          (
            VERSION_CODE=$(git rev-list --count HEAD)
            VERSION_NAME="1.0.$VERSION_CODE"
            # versionCode "nativo": congelado no ULTIMO commit que tocou o codigo Android nativo
            # (app-android/android/ - Kotlin, AndroidManifest, build.gradle, res, gradle). O app e' uma
            # WebView do proprio site, entao mudanca so de JS/HTML chega sozinha ao recarregar e NAO
            # exige reinstalar - por isso o version.json (checado pelo UpdateChecker) anuncia esse
            # numero, e nao o total de commits, senao o app pediria APK novo a cada commit do site.
            NATIVE_COMMIT=$(git log -1 --format=%H -- app-android/android/)
            NATIVE_VERSION_CODE=$(git rev-list --count "${NATIVE_COMMIT:-HEAD}")
            NATIVE_VERSION_NAME="1.0.$NATIVE_VERSION_CODE"
            cd app-android
            npm ci
            npm run cap:sync
            chmod +x android/gradlew
            # O APK segue com o versionCode full (sempre crescente) - necessario pro Android permitir
            # instalar por cima. So o version.json usa o versionCode nativo.
            (cd android && ./gradlew assembleDebug \
              -PPROFSIS_VERSION_CODE="$VERSION_CODE" \
              -PPROFSIS_VERSION_NAME="$VERSION_NAME")
            mkdir -p dist
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/profsis3-debug.apk
            # version.json e checado pelo UpdateChecker (com.profsis3.sed.update) a cada abertura do app.
            # Anuncia a versao NATIVA: so avisa "nova versao" quando ha mudanca que realmente exige APK.
            printf '{"versionCode": %s, "versionName": "%s", "apkUrl": "https://rafanunesran.github.io/ProfSis3/app-android/dist/profsis3-debug.apk"}\n' \
              "$NATIVE_VERSION_CODE" "$NATIVE_VERSION_NAME" > dist/version.json
          ) || echo "Build do APK Android falhou - publicando o site sem atualizar o APK desta vez."
          # node_modules/ e as pastas de build do Gradle não devem ir pro Pages (path: '.' abaixo
          # sobe o repo inteiro) - limpa sempre, mesmo se o build acima falhou.
          rm -rf app-android/node_modules \
                 app-android/android/.gradle \
                 app-android/android/build \
                 app-android/android/app/build \
                 app-android/android/capacitor-cordova-android-plugins

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
