<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Referência Auth</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- TELA DE LOGIN/CADASTRO -->
    <div id="authContainer" class="auth-screen">
        <!-- O conteúdo será injetado via JS -->
    </div>

    <script>
        // LÓGICA DE REFERÊNCIA PARA AUTENTICAÇÃO
        
        function renderLogin() {
            document.getElementById('authContainer').innerHTML = `
                <div class="auth-box">
                    <h2>🔐 Login</h2>
                    <form onsubmit="fazerLogin(event)">
                        <label>Email: <input type="email" id="loginEmail" required></label>
                        <label>Senha: 
                            <div class="password-wrapper">
                                <input type="password" id="loginSenha" required style="padding-right: 35px;">
                                <button type="button" class="toggle-password" onclick="toggleSenha('loginSenha', this)">👁️</button>
                            </div>
                        </label>
                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Entrar</button>
                    </form>
                    <span class="auth-link" onclick="renderCadastro()">Não tem conta? Cadastre-se</span>
                </div>
            `;
        }

        function renderCadastro() {
            // Simulação de escolas para o select
            let schools = JSON.parse(localStorage.getItem('app_schools') || '[]');
            if (schools.length === 0) {
                schools = [{id: 'teste', nome: 'Escola Exemplo (Local)'}];
            }
            const options = schools.map(s => `<option value="${s.id}">${s.nome}</option>`).join('');

            document.getElementById('authContainer').innerHTML = `
                <div class="auth-box">
                    <h2>📝 Cadastro</h2>
                    <form onsubmit="fazerCadastro(event)">
                        <label>Nome: <input type="text" id="cadNome" required></label>
                        <label>Email: <input type="email" id="cadEmail" required></label>
                        <label>Escola: 
                            <select id="cadEscola" required>
                                <option value="">Selecione sua escola...</option>
                                ${options}
                            </select>
                        </label>
                        <label>Senha: 
                            <div class="password-wrapper">
                                <input type="password" id="cadSenha" required style="padding-right: 35px;">
                                <button type="button" class="toggle-password" onclick="toggleSenha('cadSenha', this)">👁️</button>
                            </div>
                        </label>
                        <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 10px;">Criar Conta</button>
                    </form>
                    <span class="auth-link" onclick="renderLogin()">Já tem conta? Faça Login</span>
                </div>
            `;
        }

        function toggleSenha(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function fazerCadastro(e) {
            e.preventDefault();
            // Lógica de salvar usuário (no Firebase será createUserWithEmailAndPassword)
            alert('Cadastro realizado (Simulação)');
            renderLogin();
        }

        function fazerLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;

            // Super Admin Check (Referência)
            // Esta é uma tela de referência/maquete: nunca coloque credencial real aqui.
            // Ela é publicada no GitHub Pages junto com o site.
            if (email === 'rafaelnf93@gmail.com') {
                alert('Login Admin (simulado)');
                return;
            }
            
            // Lógica de validação (no Firebase será signInWithEmailAndPassword)
            alert('Login simulado para: ' + email);
        }

        // Inicialização
        renderLogin();
    </script>
</body>
</html>
